<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoopa Eats</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="customerApp"><header class="site-header"><button onclick="customerHome()">Home</button><button onclick="openDashboardTab()">Restaurant dash board</button><b>HOOPA EATS</b><button onclick="myRestaurant()">My restaurant</button><button onclick="siteSettings()">Settings</button></header><main class="home-main"><h1>What are you craving?</h1><input id="search" placeholder="Search restaurants or food" oninput="filterFood()"><nav><span>All</span><span>Breakfast</span><span>Lunch</span><span>Dinner</span><span>Specials</span></nav><section id="feed"></section></main><div class="customer-bottom"><button onclick="openDashboardSection('orders')"><span>🧾</span>Orders</button><button onclick="openDashboardSection('notifications')"><span>🔔</span>Alerts</button><button onclick="chat()"><span>💬</span>Chat</button></div></div><section id="ownerApp" class="owner-app" hidden></section><dialog id="sheet"><button class="x" onclick="sheet.close()">×</button><div id="inside"></div></dialog><script src="app.js"></script></body></html>
