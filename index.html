<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoopa Eats</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div id="customerApp">
<header class="site-header"><nav class="top-nav"><button onclick="customerHome()">Home</button><button onclick="openDashboardTab()">Restaurant dashboard</button><b class="wordmark">HOOPA EATS</b><button onclick="myRestaurant()">My restaurant</button><button onclick="siteSettings()">Settings</button></nav></header>
<main class="home-main"><section class="home-search"><h1>What are you craving?</h1><form id="foodSearchForm" class="food-search-form"><input id="search" type="search" placeholder="Search restaurants or food" autocomplete="off"><button type="submit" class="search-submit" aria-label="Search">Search</button></form><nav class="meal-filters"><span>All</span><span>Breakfast</span><span>Lunch</span><span>Dinner</span><span>Specials</span></nav></section><section id="feed"></section></main>
<nav class="customer-bottom"><button onclick="openDashboardSection('orders')"><span>🧾</span><b>Orders</b></button><button onclick="openDashboardSection('notifications')"><span>🔔</span><b>Alerts</b></button><button onclick="payments()"><span>💳</span><b>Payments</b></button></nav></div>
<section id="ownerApp" class="owner-app" hidden></section><dialog id="sheet"><button class="x" onclick="sheet.close()">×</button><div id="inside"></div></dialog><script src="app.js?v=20260918-search-final"></script></body></html>
